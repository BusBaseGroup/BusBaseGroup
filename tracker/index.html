<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15181d">
  <title>Bus Tracker</title>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <style>
    :root{
      --bg:#f4f5f7;
      --panel:#fff;
      --ink:#17191d;
      --muted:#667085;
      --line:#e4e7ec;
      --brand:#d71920;
      --brand-dark:#aa1117;
      --header:#171a20;
      --unknown:#4b5563;
      --good:#16803c;
      --bad:#c62828;
      --amber:#b77900;
      --sidebar:360px;
      --shadow:0 10px 30px rgba(15,23,42,.14);
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;}
    body{
      height:100vh;
      height:100dvh;
      overflow:hidden;
      display:grid;
      grid-template-rows:60px minmax(0,1fr);
      background:var(--bg);
      color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    a{color:inherit}

    .topbar{
      min-width:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:0 14px;
      background:var(--header);
      color:#fff;
      border-bottom:3px solid var(--brand);
      z-index:1000;
    }
    .brand{min-width:0;display:flex;align-items:center;gap:10px}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--brand);font-weight:950}
    .brand-copy{min-width:0}
    .brand-title{font-size:15px;font-weight:900;line-height:1.05}
    .brand-sub{margin-top:3px;color:#bdc4ce;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}
    .top-btn{min-height:36px;border:1px solid #343b47;border-radius:8px;background:#20252e;color:#fff;padding:0 11px;font-size:12px;font-weight:800}
    .top-btn:hover{background:#2b313c}
    .top-btn.admin{display:none;align-items:center;text-decoration:none;background:var(--brand);border-color:var(--brand)}
    .top-btn.admin:hover{background:var(--brand-dark)}

    .app-main{
      min-width:0;
      min-height:0;
      display:grid;
      grid-template-columns:var(--sidebar) minmax(0,1fr);
      background:#dce2e8;
    }

    .vehicle-pane{
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
      background:var(--panel);
      border-right:1px solid var(--line);
      overflow:hidden;
      z-index:2;
    }
    .vehicle-head{flex:0 0 auto;padding:15px 14px 12px;border-bottom:1px solid var(--line);background:#fff}
    .vehicle-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .vehicle-title-row h1{margin:0;font-size:18px;line-height:1.15;letter-spacing:-.025em}
    .summary{margin-top:4px;color:var(--muted);font-size:12px}
    .live-pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 9px;border:1px solid #cbead4;border-radius:999px;background:#f4fbf6;color:#12642f;font-size:10.5px;font-weight:850;white-space:nowrap}
    .live-pill.loading{border-color:#e1e5ea;background:#f8f9fa;color:#667085}
    .live-pill.error{border-color:#f4c9c9;background:#fff4f4;color:#9f1d1d}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
    .live-pill.loading .live-dot{background:#98a2b3}
    .live-pill.error .live-dot{background:var(--bad)}

    .filters{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
    .route-select,.refresh-btn{min-height:40px;border:1px solid #d5d9df;border-radius:8px;background:#fff;color:var(--ink);outline:none}
    .route-select{width:100%;padding:0 10px}
    .refresh-btn{padding:0 12px;font-size:12px;font-weight:850}
    .route-select:focus,.refresh-btn:focus-visible,.map-tool:focus-visible,.top-btn:focus-visible,.fav-btn:focus-visible,.close:focus-visible,.tab:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:3px solid rgba(215,25,32,.15);outline-offset:1px}
    .refresh-btn:hover{background:#f7f8fa}

    .list-scroll{min-height:0;flex:1 1 auto;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#cdd2d9 transparent}
    .vehicle-list{padding:7px}
    .vehicle-card{width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) 34px;gap:9px;align-items:start;padding:9px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;color:inherit;transition:background .12s,border-color .12s}
    .vehicle-card+.vehicle-card{margin-top:2px}
    .vehicle-card:hover{background:#f5f6f8}
    .vehicle-card.active{background:#fff3f3;border-color:#f3c7c9}
    .route-badge{min-width:44px;height:36px;padding:0 5px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:950;line-height:1}
    .vehicle-card.unknown .route-badge{background:var(--unknown)}
    .vehicle-main{min-width:0}
    .vehicle-name,.vehicle-meta,.vehicle-dest,.vehicle-time{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vehicle-name{font-size:13.5px;font-weight:900;color:#101828}
    .vehicle-meta{margin-top:2px;color:var(--muted);font-size:11.5px}
    .vehicle-dest{margin-top:5px;color:#344054;font-size:11.5px}
    .vehicle-time{margin-top:3px;color:#98a2b3;font-size:10.5px}
    .fav-btn{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:#b4bbc5;font-size:19px;line-height:1}
    .fav-btn:hover{background:#eaedf1}
    .fav-btn.on{color:var(--amber)}
    .empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.55}

    .map-pane{position:relative;min-width:0;min-height:0;overflow:hidden;background:#dce2e8}
    #map{position:absolute;inset:0;width:100%;height:100%;background:#dce2e8}

    .map-tools{position:absolute;z-index:700;top:12px;right:12px;display:grid;gap:7px}
    .map-tool{width:42px;height:42px;border:1px solid rgba(17,24,39,.13);border-radius:9px;background:#fff;color:#344054;display:grid;place-items:center;box-shadow:0 4px 14px rgba(15,23,42,.13)}
    .map-tool:hover{background:#f8fafc;color:#111827}
    .map-tool svg{width:20px;height:20px}

    .selected-card{position:absolute;z-index:700;left:12px;bottom:12px;width:min(380px,calc(100% - 24px));padding:13px;border:1px solid rgba(17,24,39,.11);border-radius:11px;background:#fff;box-shadow:var(--shadow);display:none}
    .selected-card.show{display:block}
    .selected-top{display:flex;align-items:flex-start;gap:9px}
    .selected-route{min-width:45px;height:36px;padding:0 6px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:950}
    .selected-route.unknown{background:var(--unknown)}
    .selected-copy{min-width:0;flex:1}
    .selected-title{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .selected-sub{margin-top:2px;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .selected-dest{margin-top:8px;color:#344054;font-size:11.5px}
    .selected-time{margin-top:4px;color:#98a2b3;font-size:10.5px}
    .selected-close{width:30px;height:30px;flex:0 0 auto;border:0;border-radius:7px;background:#f1f3f5;color:#475467;font-size:17px;line-height:1}

    .map-status{position:absolute;z-index:700;left:12px;top:12px;max-width:min(420px,calc(100% - 80px));display:none;padding:9px 11px;border:1px solid #f0c9c9;border-radius:8px;background:#fff7f7;color:#8f1f1f;box-shadow:0 4px 14px rgba(15,23,42,.10);font-size:11.5px;line-height:1.4}
    .map-status.show{display:block}

    /* MapLibre/OpenFreeMap */
    #map .maplibregl-canvas{outline:none}
    #map .maplibregl-ctrl-group{border-radius:9px;box-shadow:0 4px 14px rgba(15,23,42,.13);overflow:hidden}
    #map .maplibregl-ctrl-group button{width:38px;height:38px}
    #map .maplibregl-ctrl-attrib{font-size:10px}
    #map .maplibregl-popup-content{padding:12px 13px;border-radius:11px;box-shadow:0 12px 32px rgba(15,23,42,.18)}
    #map .maplibregl-popup-close-button{width:30px;height:30px;border-radius:7px;font-size:18px;color:#667085}
    #map .maplibregl-popup-close-button:hover{background:#f2f4f7}
    .bus-map-marker{width:38px;height:38px;padding:0;border:3px solid #fff;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,23,42,.34);font:900 11.5px/1 Inter,ui-sans-serif,system-ui,sans-serif;white-space:nowrap;position:relative;transform:translateZ(0)}
    .bus-map-marker::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);opacity:.24;pointer-events:none}
    .bus-map-marker.unknown{background:var(--unknown)}
    .bus-map-marker.selected{width:44px;height:44px;border-width:4px;box-shadow:0 6px 18px rgba(15,23,42,.42)}
    .bus-map-marker:focus-visible{outline:3px solid rgba(215,25,32,.25);outline-offset:3px}
    .popup{min-width:205px;padding-right:10px}
    .popup-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .popup-route{min-width:38px;height:28px;padding:0 7px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:950;font-size:12px}
    .popup-route.unknown{background:var(--unknown)}
    .popup-title{font-weight:900;font-size:13px}
    .popup-row{margin-top:5px;color:#475467;font-size:11.5px}
    .popup-muted{margin-top:7px;color:#98a2b3;font-size:10.5px}

    .modal-backdrop{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.52)}
    .modal-backdrop.show{display:flex}
    .modal{width:min(430px,100%);max-height:calc(100dvh - 32px);overflow:auto;border-radius:13px;background:#fff;box-shadow:0 25px 80px rgba(0,0,0,.28)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}
    .modal-head h2{margin:0;font-size:17px}
    .close{width:34px;height:34px;border:0;border-radius:8px;background:#f1f3f5;color:#475467;font-size:20px}
    .modal-body{padding:16px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;border-radius:9px;background:#f2f4f7}
    .tab{min-height:38px;border:0;border-radius:7px;background:transparent;color:#667085;font-weight:800}
    .tab.active{background:#fff;color:#101828;box-shadow:0 1px 3px rgba(15,23,42,.10)}
    .field{margin-top:13px}
    .field label{display:block;margin-bottom:6px;font-size:11.5px;font-weight:850}
    .field input{width:100%;min-height:44px;border:1px solid #d0d5dd;border-radius:8px;padding:9px 10px;outline:none}
    .field input:focus{border-color:#98a2b3;box-shadow:0 0 0 3px rgba(152,162,179,.15)}
    .primary,.secondary{width:100%;min-height:43px;border-radius:8px;font-weight:850}
    .primary{margin-top:14px;border:0;background:var(--brand);color:#fff}
    .primary:hover{background:var(--brand-dark)}
    .secondary{border:1px solid var(--line);background:#fff;color:#344054}
    .link-btn{margin-top:10px;border:0;background:transparent;padding:0;color:#475467;font-size:11.5px;font-weight:750}
    .auth-message{min-height:18px;margin-top:10px;color:var(--bad);font-size:11.5px}
    .account-card{display:none}
    .account-card.show{display:block}
    .signed-name{font-size:18px;font-weight:900}
    .signed-email{margin-top:3px;color:var(--muted);font-size:12px}
    .account-actions{display:grid;gap:8px;margin-top:15px}
    .danger{color:var(--bad)}

    @media (max-width:820px){
      body{grid-template-rows:56px minmax(0,1fr)}
      .topbar{padding:0 10px}
      .brand-sub{display:none}
      .brand-mark{width:32px;height:32px}
      .top-btn{min-height:34px;padding:0 9px;max-width:155px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .app-main{grid-template-columns:1fr;grid-template-rows:minmax(0,58fr) minmax(0,42fr)}
      .map-pane{grid-row:1;grid-column:1}
      .vehicle-pane{grid-row:2;grid-column:1;border-right:0;border-top:1px solid var(--line)}
      .vehicle-head{padding:10px 11px 9px}
      .vehicle-title-row h1{font-size:16px}
      .filters{margin-top:8px}
      .route-select,.refresh-btn{min-height:38px}
      .vehicle-list{padding:5px}
      .vehicle-card{grid-template-columns:44px minmax(0,1fr) 32px;padding:8px}
      .route-badge{min-width:42px;height:35px}
      .fav-btn{width:32px;height:32px}
      .map-tools{top:9px;right:9px}
      .map-tool{width:40px;height:40px}
      .selected-card{left:9px;right:9px;bottom:9px;width:auto}
      .map-status{left:9px;top:9px}
    }

    @media (max-width:480px){
      .top-actions{gap:5px}
      .top-btn.admin{padding:0 8px}
      .live-pill{padding:0 7px}
      .vehicle-card{grid-template-columns:42px minmax(0,1fr) 30px;gap:7px}
      .route-badge{min-width:40px;height:34px}
    }

    @media (max-height:650px) and (max-width:820px){
      .app-main{grid-template-rows:minmax(0,52fr) minmax(0,48fr)}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-copy">
        <div class="brand-title">Bus Tracker</div>
        <div class="brand-sub">Live GPS vehicle positions</div>
      </div>
    </div>

    <div class="top-actions">
      <a id="adminLink" class="top-btn admin" href="admin.html">Admin</a>
      <button id="accountBtn" class="top-btn" type="button">Login / Create account</button>
    </div>
  </header>

  <main class="app-main">
    <aside class="vehicle-pane" aria-label="Live vehicles">
      <div class="vehicle-head">
        <div class="vehicle-title-row">
          <div>
            <h1>Vehicles in service</h1>
            <div id="summary" class="summary">Loading live buses…</div>
          </div>
          <div id="livePill" class="live-pill loading">
            <span class="live-dot"></span>
            <span id="livePillText">Loading</span>
          </div>
        </div>

        <div class="filters">
          <select id="routeFilter" class="route-select" aria-label="Filter by route">
            <option value="">All routes</option>
          </select>
          <button id="refreshBtn" class="refresh-btn" type="button">Refresh</button>
        </div>
      </div>

      <div class="list-scroll">
        <div id="vehicleList" class="vehicle-list"></div>
      </div>
    </aside>

    <section id="mapPane" class="map-pane" aria-label="Live bus map">
      <div id="map"></div>

      <div class="map-tools" aria-label="Map controls">
        <button id="fitBtn" class="map-tool" type="button" title="Show all visible buses" aria-label="Show all visible buses">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-5v-2h3v-3ZM8 8h8v8H8V8Zm2 2v4h4v-4h-4Z"/></svg>
        </button>
        <button id="mapRefreshBtn" class="map-tool" type="button" title="Refresh live positions" aria-label="Refresh live positions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.45 5.1l1.4-1.4L22.25 9l-3.75 3.75L14.75 9l1.4-1.4 1.16 1.16A6 6 0 1 0 18 14h2a8 8 0 1 1-8-10Z"/></svg>
        </button>
      </div>

      <div id="mapStatus" class="map-status"></div>

      <section id="selectedCard" class="selected-card" aria-live="polite">
        <div class="selected-top">
          <div id="selectedRoute" class="selected-route">—</div>
          <div class="selected-copy">
            <div id="selectedTitle" class="selected-title"></div>
            <div id="selectedSub" class="selected-sub"></div>
            <div id="selectedDest" class="selected-dest"></div>
            <div id="selectedTime" class="selected-time"></div>
          </div>
          <button id="selectedClose" class="selected-close" type="button" aria-label="Close vehicle details">×</button>
        </div>
      </section>
    </section>
  </main>

  <div id="accountModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
    <div class="modal">
      <div class="modal-head">
        <h2 id="accountTitle">Account</h2>
        <button id="closeModal" class="close" type="button" aria-label="Close">×</button>
      </div>

      <div class="modal-body">
        <div id="signedOutBox">
          <div class="tabs">
            <button id="loginTab" class="tab active" type="button">Login</button>
            <button id="registerTab" class="tab" type="button">Create account</button>
          </div>

          <form id="authForm">
            <div id="nameField" class="field" style="display:none">
              <label for="displayName">Name</label>
              <input id="displayName" autocomplete="name">
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" autocomplete="current-password" minlength="6" required>
            </div>
            <div id="confirmField" class="field" style="display:none">
              <label for="confirmPassword">Confirm password</label>
              <input id="confirmPassword" type="password" minlength="6">
            </div>
            <button id="authSubmit" class="primary" type="submit">Login</button>
            <button id="forgotBtn" class="link-btn" type="button">Forgot password?</button>
            <div id="authMessage" class="auth-message"></div>
          </form>
        </div>

        <div id="signedInBox" class="account-card">
          <div class="signed-name" id="signedName"></div>
          <div class="signed-email" id="signedEmail"></div>
          <div class="account-actions">
            <button id="showFavsBtn" class="secondary" type="button">Show my favourites</button>
            <button id="signOutBtn" class="secondary danger" type="button">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKxl6hCqHsmv8SqVTDIZcQqLoNPVWpXsg",
      authDomain: "busbase-bus-tracker.firebaseapp.com",
      projectId: "busbase-bus-tracker",
      storageBucket: "busbase-bus-tracker.firebasestorage.app",
      messagingSenderId: "380602561765",
      appId: "1:380602561765:web:5bf01fc6d7982dc950500c"
    };

    // Direct BusTimes live feed. No separate API_BASE or API key is needed.
    const BUSTIMES_LIVE_URL = 'https://bustimes.org/vehicles.json?operator=LYNX';

    // No map API key is required. The map uses MapLibre + OpenFreeMap.
    const MAP_STYLE = 'https://tiles.openfreemap.org/styles/liberty';

    // Check BusTimes frequently, but always display the newest RAW GPS point.
    // We deliberately do NOT interpolate between points because straight-line animation
    // can cut corners and make a bus look like it is driving through fields/buildings.
    const REFRESH_MS = 7000;
    const MAPPING_REFRESH_MS = 60000;
    const STALE_POSITION_MS = 4 * 60 * 1000;
    const DEFAULT_CENTER = { lat: 52.7517, lng: 0.3970 };
    const DEFAULT_ZOOM = 10;
    const LIVE_AREA = { south: 52.10, west: -1.00, north: 53.30, east: 1.80 };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    const ids = [
      'summary','routeFilter','refreshBtn','vehicleList','accountBtn','adminLink',
      'accountModal','closeModal','signedOutBox','signedInBox','loginTab','registerTab',
      'authForm','nameField','displayName','email','password','confirmField','confirmPassword',
      'authSubmit','forgotBtn','authMessage','signedName','signedEmail','showFavsBtn','signOutBtn',
      'fitBtn','mapRefreshBtn','livePill','livePillText','selectedCard','selectedRoute','selectedTitle',
      'selectedSub','selectedDest','selectedTime','selectedClose','mapStatus','mapPane','map'
    ];
    const els = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));

    const state = {
      vehicles: [],
      markers: new Map(),
      route: '',
      selectedId: null,
      timer: null,
      loadingLive: false,
      firstGoodLoad: true,
      user: null,
      isAdmin: false,
      favourites: new Set(),
      showFavouritesOnly: false,
      authMode: 'login',
      map: null,
      popup: null,
      mapReady: false,
      infoOpenId: null,
      followSelected: false,
      mappingCache: new Map(),
      mappingLoadedAt: 0
    };

    const collator = new Intl.Collator('en-GB', { numeric: true, sensitivity: 'base' });

    onAuthStateChanged(auth, async user => {
      state.user = user;
      state.isAdmin = false;
      state.favourites = new Set();

      if (user) {
        els.accountBtn.textContent = user.displayName || user.email || 'Account';
        els.signedOutBox.style.display = 'none';
        els.signedInBox.classList.add('show');
        els.signedName.textContent = user.displayName || 'My account';
        els.signedEmail.textContent = user.email || '';

        try {
          const [userSnap, adminSnap] = await Promise.all([
            getDoc(doc(db, 'users', user.uid)),
            getDoc(doc(db, 'admins', user.uid))
          ]);

          if (userSnap.exists()) {
            const data = userSnap.data();
            state.favourites = new Set(Array.isArray(data.favouriteVehicles) ? data.favouriteVehicles : []);
          } else {
            await setDoc(doc(db, 'users', user.uid), {
              displayName: user.displayName || '',
              email: user.email || '',
              favouriteVehicles: []
            }, { merge: true });
          }

          state.isAdmin = adminSnap.exists() && adminSnap.data()?.admin === true;
          els.adminLink.style.display = state.isAdmin ? 'inline-flex' : 'none';
        } catch (error) {
          console.error('Could not load account data:', error);
        }
      } else {
        els.accountBtn.textContent = 'Login / Create account';
        els.signedOutBox.style.display = 'block';
        els.signedInBox.classList.remove('show');
        els.adminLink.style.display = 'none';
        state.showFavouritesOnly = false;
      }

      render();
    });

    els.accountBtn.addEventListener('click', () => els.accountModal.classList.add('show'));
    els.closeModal.addEventListener('click', closeModal);
    els.accountModal.addEventListener('click', event => {
      if (event.target === els.accountModal) closeModal();
    });
    els.loginTab.addEventListener('click', () => setAuthMode('login'));
    els.registerTab.addEventListener('click', () => setAuthMode('register'));

    els.refreshBtn.addEventListener('click', () => loadLive(true));
    els.mapRefreshBtn.addEventListener('click', () => loadLive(true));
    els.fitBtn.addEventListener('click', () => fitToVehicles(visibleVehicles()));

    els.routeFilter.addEventListener('change', () => {
      state.route = els.routeFilter.value;
      state.selectedId = null;
      state.followSelected = false;
      state.infoOpenId = null;
      hideSelectedCard();
      if (state.popup) { state.popup.remove(); state.popup = null; }
      render();
      fitToVehicles(visibleVehicles());
    });

    els.selectedClose.addEventListener('click', () => {
      state.selectedId = null;
      state.followSelected = false;
      state.infoOpenId = null;
      hideSelectedCard();
      if (state.popup) { state.popup.remove(); state.popup = null; }
      renderList(visibleVehicles());
      renderMarkers(visibleVehicles());
    });

    els.showFavsBtn.addEventListener('click', () => {
      state.showFavouritesOnly = !state.showFavouritesOnly;
      els.showFavsBtn.textContent = state.showFavouritesOnly ? 'Show all vehicles' : 'Show my favourites';
      closeModal();
      state.selectedId = null;
      state.followSelected = false;
      state.infoOpenId = null;
      hideSelectedCard();
      if (state.popup) { state.popup.remove(); state.popup = null; }
      render();
      fitToVehicles(visibleVehicles());
    });

    els.signOutBtn.addEventListener('click', async () => {
      await signOut(auth);
      closeModal();
    });

    els.authForm.addEventListener('submit', async event => {
      event.preventDefault();
      els.authMessage.textContent = '';
      const email = els.email.value.trim();
      const password = els.password.value;

      try {
        if (state.authMode === 'register') {
          const name = els.displayName.value.trim();
          if (password !== els.confirmPassword.value) throw new Error('Passwords do not match.');

          const credential = await createUserWithEmailAndPassword(auth, email, password);
          if (name) await updateProfile(credential.user, { displayName: name });

          await setDoc(doc(db, 'users', credential.user.uid), {
            displayName: name,
            email,
            favouriteVehicles: []
          }, { merge: true });

          els.authMessage.style.color = 'var(--good)';
          els.authMessage.textContent = 'Account created.';
          setTimeout(closeModal, 500);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          closeModal();
        }
      } catch (error) {
        els.authMessage.style.color = 'var(--bad)';
        els.authMessage.textContent = friendlyAuthError(error);
      }
    });

    els.forgotBtn.addEventListener('click', async () => {
      const email = els.email.value.trim();
      if (!email) {
        els.authMessage.textContent = 'Enter your email address first.';
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        els.authMessage.style.color = 'var(--good)';
        els.authMessage.textContent = 'Password reset email sent.';
      } catch (error) {
        els.authMessage.style.color = 'var(--bad)';
        els.authMessage.textContent = friendlyAuthError(error);
      }
    });

    async function toggleFavourite(vehicle) {
      if (!state.user) {
        setAuthMode('login');
        els.accountModal.classList.add('show');
        return;
      }

      const key = favouriteKey(vehicle);
      if (state.favourites.has(key)) state.favourites.delete(key);
      else state.favourites.add(key);

      await setDoc(doc(db, 'users', state.user.uid), {
        favouriteVehicles: [...state.favourites]
      }, { merge: true });
      render();
    }

    async function initialiseMap() {
      showMapStatus('Loading map…');

      try {
        if (!window.maplibregl) {
          throw new Error('Map library could not be loaded.');
        }

        state.map = new maplibregl.Map({
          container: els.map,
          style: MAP_STYLE,
          center: [DEFAULT_CENTER.lng, DEFAULT_CENTER.lat],
          zoom: DEFAULT_ZOOM,
          minZoom: 7,
          maxZoom: 19,
          attributionControl: true
        });

        state.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
        state.map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-left');

        state.map.on('dragstart', () => {
          state.followSelected = false;
        });

        state.map.on('load', () => {
          state.mapReady = true;
          hideMapStatus();
          renderMarkers(visibleVehicles());

          if (state.firstGoodLoad && validVehicles(state.vehicles).length) {
            fitToVehicles(state.vehicles);
            state.firstGoodLoad = false;
          }
        });

        state.map.on('error', event => {
          console.error('Map error:', event?.error || event);
        });

        const resizeMap = () => {
          if (state.map) state.map.resize();
        };

        if ('ResizeObserver' in window) {
          const observer = new ResizeObserver(() => resizeMap());
          observer.observe(els.mapPane);
        }

        window.addEventListener('resize', resizeMap, { passive: true });
        window.addEventListener('orientationchange', () => setTimeout(resizeMap, 180), { passive: true });

      } catch (error) {
        console.error(error);
        showMapStatus(error.message || 'Map could not be loaded.');
      }
    }

    async function loadLive(manual = false) {
      if (state.loadingLive) return;
      state.loadingLive = true;

      if (manual) {
        els.refreshBtn.disabled = true;
        els.mapRefreshBtn.disabled = true;
      }

      setLiveState('loading', 'Updating');

      try {
        const [response, mappings] = await Promise.all([
          fetch(BUSTIMES_LIVE_URL, {
            cache: 'no-store',
            mode: 'cors',
            headers: { 'Accept': 'application/json' }
          }),
          getVehicleMappings(manual)
        ]);

        if (!response.ok) {
          throw new Error(`BusTimes returned HTTP ${response.status}.`);
        }

        const payload = await response.json();
        if (!Array.isArray(payload)) {
          throw new Error('BusTimes returned an unexpected live-data format.');
        }

        const seen = new Map();
        for (const item of payload) {
          const raw = parseBusTimesVehicle(item);
          if (!raw) continue;
          const previous = seen.get(raw.machineId);
          if (!previous || newer(raw.recordedAt, previous.recordedAt)) {
            seen.set(raw.machineId, raw);
          }
        }

        state.vehicles = [...seen.values()].map(raw =>
          toPublicVehicle(raw, mappings.get(raw.machineId))
        );

        updateRoutes();
        render();
        setLiveState('live', 'Live');

        if (state.firstGoodLoad && state.mapReady && validVehicles(state.vehicles).length) {
          fitToVehicles(state.vehicles);
          state.firstGoodLoad = false;
        }
      } catch (error) {
        console.error(error);
        setLiveState('error', 'Offline');
        if (!state.vehicles.length) {
          const message = /Failed to fetch|CORS|NetworkError/i.test(String(error?.message || error))
            ? 'Your browser blocked the direct BusTimes live feed. This direct version needs BusTimes to allow cross-site requests.'
            : (error.message || 'Could not load live vehicles.');
          els.vehicleList.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
          els.summary.textContent = 'Live data unavailable';
        }
      } finally {
        state.loadingLive = false;
        els.refreshBtn.disabled = false;
        els.mapRefreshBtn.disabled = false;
        clearTimeout(state.timer);
        state.timer = setTimeout(loadLive, REFRESH_MS);
      }
    }

    async function getVehicleMappings(force = false) {
      const now = Date.now();
      if (!force && state.mappingCache.size && now - state.mappingLoadedAt < MAPPING_REFRESH_MS) {
        return state.mappingCache;
      }

      const snap = await getDocs(collection(db, 'vehicles'));
      const map = new Map();
      snap.forEach(document => map.set(document.id, document.data() || {}));
      state.mappingCache = map;
      state.mappingLoadedAt = now;
      return map;
    }

    function parseBusTimesVehicle(item) {
      if (!item || typeof item !== 'object') return null;

      const coordinates = Array.isArray(item.coordinates)
        ? item.coordinates
        : Array.isArray(item.location?.coordinates)
          ? item.location.coordinates
          : null;

      if (!coordinates || coordinates.length < 2) return null;

      const longitude = Number(coordinates[0]);
      const latitude = Number(coordinates[1]);
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;

      const vehicleInfo = item.vehicle && typeof item.vehicle === 'object' ? item.vehicle : {};
      const machineId = vehicleKeyFromBusTimes(vehicleInfo, item);
      if (!machineId) return null;

      const service = item.service && typeof item.service === 'object' ? item.service : {};

      return {
        machineId,
        machineLabel: machineLabelFromBusTimes(vehicleInfo, machineId),
        route: clean(service.line_name ?? item.route_name ?? item.line_name ?? item.route ?? ''),
        lineRef: clean(item.service_id ?? service.id ?? service.url ?? ''),
        direction: '',
        origin: clean(item.origin ?? item.origin_name ?? ''),
        destination: clean(item.destination ?? item.destination_name ?? item.headsign ?? item.trip?.headsign ?? ''),
        destinationRef: clean(item.destination_ref ?? ''),
        latitude,
        longitude,
        bearing: numberOrNull(item.direction ?? item.bearing ?? item.heading),
        recordedAt: normalizeDate(item.datetime ?? item.recorded_at ?? item.recordedAt ?? item.timestamp ?? item.time),
        journeyRef: clean(item.journey_id ?? item.journeyRef ?? item.trip_id ?? '')
      };
    }

    function vehicleKeyFromBusTimes(vehicleInfo, item) {
      const url = clean(vehicleInfo.url);
      if (url) {
        const bits = url.split('/').filter(Boolean);
        const slug = bits[bits.length - 1] || '';
        if (slug) return slug.slice(0, 180);
      }

      const explicit = clean(item.vehicle_id ?? item.vehicleId ?? vehicleInfo.id ?? '');
      if (explicit) return `bt-${explicit}`.slice(0, 180);

      const name = clean(vehicleInfo.name);
      return name ? `bt-${slugify(name)}`.slice(0, 180) : '';
    }

    function machineLabelFromBusTimes(vehicleInfo, machineId) {
      const name = clean(vehicleInfo.name);
      if (name.includes(' - ')) {
        const first = clean(name.split(' - ')[0]);
        if (first) return first;
      }
      return machineId;
    }

    function toPublicVehicle(vehicle, mapping) {
      if (mapping) {
        return {
          id: `mapped:${vehicle.machineId}`,
          mapped: true,
          fleetNumber: clean(mapping.fleetNumber),
          registration: clean(mapping.registration),
          vehicleType: clean(mapping.vehicleType),
          livery: clean(mapping.livery),
          route: vehicle.route,
          lineRef: vehicle.lineRef,
          direction: vehicle.direction,
          origin: vehicle.origin,
          destination: vehicle.destination,
          destinationRef: vehicle.destinationRef,
          latitude: vehicle.latitude,
          longitude: vehicle.longitude,
          bearing: vehicle.bearing,
          recordedAt: vehicle.recordedAt,
          journeyRef: vehicle.journeyRef
        };
      }

      return {
        id: `machine:${vehicle.machineId}`,
        mapped: false,
        machineId: vehicle.machineId,
        machineLabel: vehicle.machineLabel,
        route: vehicle.route,
        lineRef: vehicle.lineRef,
        direction: vehicle.direction,
        origin: vehicle.origin,
        destination: vehicle.destination,
        destinationRef: vehicle.destinationRef,
        latitude: vehicle.latitude,
        longitude: vehicle.longitude,
        bearing: vehicle.bearing,
        recordedAt: vehicle.recordedAt,
        journeyRef: vehicle.journeyRef
      };
    }

    function clean(value) {
      return String(value ?? '').trim();
    }

    function numberOrNull(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number : null;
    }

    function normalizeDate(value) {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toISOString();
    }

    function isFreshPosition(vehicle) {
      if (!vehicle.recordedAt) return true;
      const time = Date.parse(vehicle.recordedAt);
      if (!Number.isFinite(time)) return true;
      return Date.now() - time <= STALE_POSITION_MS;
    }

    function newer(a, b) {
      return (Date.parse(a || '') || 0) >= (Date.parse(b || '') || 0);
    }

    function slugify(value) {
      return clean(value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function setLiveState(mode, text) {
      els.livePill.className = `live-pill${mode === 'loading' ? ' loading' : mode === 'error' ? ' error' : ''}`;
      els.livePillText.textContent = text;
    }

    function visibleVehicles() {
      return state.vehicles
        .filter(vehicle => !state.route || vehicle.route === state.route)
        .filter(vehicle => !state.showFavouritesOnly || state.favourites.has(favouriteKey(vehicle)))
        .sort(vehicleSort);
    }

    function isValidPosition(vehicle) {
      if (!Number.isFinite(vehicle.latitude) || !Number.isFinite(vehicle.longitude)) return false;
      return vehicle.latitude >= LIVE_AREA.south &&
             vehicle.latitude <= LIVE_AREA.north &&
             vehicle.longitude >= LIVE_AREA.west &&
             vehicle.longitude <= LIVE_AREA.east;
    }

    function validVehicles(vehicles) {
      return vehicles.filter(vehicle => isValidPosition(vehicle) && isFreshPosition(vehicle));
    }

    function updateRoutes() {
      const current = state.route;
      const routes = [...new Set(state.vehicles.map(v => String(v.route || '').trim()).filter(Boolean))]
        .sort((a,b) => collator.compare(a,b));

      els.routeFilter.innerHTML = '<option value="">All routes</option>' + routes
        .map(route => `<option value="${escapeAttr(route)}">${escapeHtml(route)}</option>`)
        .join('');

      if (routes.includes(current)) els.routeFilter.value = current;
      else {
        state.route = '';
        els.routeFilter.value = '';
      }
    }

    function render() {
      const vehicles = visibleVehicles();
      els.summary.textContent = `${vehicles.length} live ${vehicles.length === 1 ? 'vehicle' : 'vehicles'}${state.route ? ` on route ${state.route}` : ''}${state.showFavouritesOnly ? ' • favourites' : ''}`;
      renderList(vehicles);
      renderMarkers(vehicles);
      renderSelectedCard();
    }

    function renderList(vehicles) {
      if (!vehicles.length) {
        els.vehicleList.innerHTML = '<div class="empty">No live vehicles match this filter.</div>';
        return;
      }

      els.vehicleList.innerHTML = vehicles.map(vehicle => {
        const active = state.selectedId === vehicle.id ? ' active' : '';
        const unknown = vehicle.mapped ? '' : ' unknown';
        const favourite = state.favourites.has(favouriteKey(vehicle));
        const dest = vehicle.destination ? `to ${vehicle.destination}` : 'Live journey';

        return `
          <div class="vehicle-card${unknown}${active}" data-card="${escapeAttr(vehicle.id)}" role="button" tabindex="0">
            <span class="route-badge">${escapeHtml(vehicle.route || '—')}</span>
            <span class="vehicle-main">
              <span class="vehicle-name">${escapeHtml(publicVehicleTitle(vehicle))}</span>
              <span class="vehicle-meta">${escapeHtml(publicVehicleSubtitle(vehicle))}</span>
              <span class="vehicle-dest">${escapeHtml(dest)}</span>
              <span class="vehicle-time">GPS ${escapeHtml(timeAgo(vehicle.recordedAt))}</span>
            </span>
            <button class="fav-btn ${favourite ? 'on' : ''}" type="button" data-fav="${escapeAttr(vehicle.id)}" aria-label="${state.user ? 'Favourite this vehicle' : 'Login to save favourites'}" title="${state.user ? 'Favourite this vehicle' : 'Login to save favourites'}">★</button>
          </div>`;
      }).join('');

      els.vehicleList.querySelectorAll('[data-card]').forEach(card => {
        const activate = event => {
          if (event.target.closest('[data-fav]')) return;
          selectVehicle(card.dataset.card);
        };
        card.addEventListener('click', activate);
        card.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            activate(event);
          }
        });
      });

      els.vehicleList.querySelectorAll('[data-fav]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          const vehicle = vehicles.find(item => item.id === button.dataset.fav);
          if (vehicle) toggleFavourite(vehicle);
        });
      });
    }

    function renderMarkers(vehicles) {
      if (!state.mapReady || !state.map) return;

      const valid = validVehicles(vehicles);
      const idsNow = new Set(valid.map(vehicle => vehicle.id));

      for (const [id, entry] of state.markers) {
        if (!idsNow.has(id)) {
          if (entry.animationFrame) cancelAnimationFrame(entry.animationFrame);
          entry.marker.remove();
          state.markers.delete(id);
        }
      }

      for (const vehicle of valid) {
        const target = { lat: vehicle.latitude, lng: vehicle.longitude };
        let entry = state.markers.get(vehicle.id);

        if (!entry) {
          const element = document.createElement('button');
          element.type = 'button';
          element.className = 'bus-map-marker';
          element.setAttribute('aria-label', `${vehicle.route || 'Bus'} ${publicVehicleTitle(vehicle)}`);
          updateMarkerElement(element, vehicle);

          // Anchor the CENTRE of the marker to the GPS coordinate.
          // This prevents the marker graphic itself from appearing several pixels
          // south of the real point, which was happening with the old pin tip.
          const marker = new maplibregl.Marker({ element, anchor: 'center' })
            .setLngLat([target.lng, target.lat])
            .addTo(state.map);

          entry = {
            marker,
            element,
            vehicle,
            recordedAt: vehicle.recordedAt || '',
            target,
            animationFrame: null
          };

          element.addEventListener('click', event => {
            event.stopPropagation();
            selectVehicle(vehicle.id, false);
          });

          state.markers.set(vehicle.id, entry);
        } else {
          entry.vehicle = vehicle;
          updateMarkerElement(entry.element, vehicle);

          const positionChanged = !entry.target || distanceMetres(entry.target, target) >= 0.5;
          if (positionChanged || entry.recordedAt !== (vehicle.recordedAt || '')) {
            setMarkerToExactGps(entry, target);
            entry.recordedAt = vehicle.recordedAt || '';
            entry.target = target;

            if (state.followSelected && state.selectedId === vehicle.id) {
              state.map.easeTo({
                center: [target.lng, target.lat],
                duration: 280,
                essential: true
              });
            }
          }
        }
      }

      if (state.selectedId) {
        const selected = valid.find(vehicle => vehicle.id === state.selectedId);
        if (selected && state.infoOpenId === selected.id) openVehicleInfo(selected);
      }
    }

    function updateMarkerElement(element, vehicle) {
      element.textContent = String(vehicle.route || '—').slice(0, 6);
      element.classList.toggle('unknown', vehicle.mapped !== true);
      element.classList.toggle('selected', state.selectedId === vehicle.id);
      element.title = `${vehicle.route || 'Bus'} • ${publicVehicleTitle(vehicle)}`;
      element.setAttribute('aria-label', `${vehicle.route || 'Bus'} ${publicVehicleTitle(vehicle)}`);
    }

    function setMarkerToExactGps(entry, target) {
      // Use the exact latest BusTimes coordinate immediately.
      // Never estimate/extrapolate or draw a straight line between old/new points.
      if (entry.animationFrame) {
        cancelAnimationFrame(entry.animationFrame);
        entry.animationFrame = null;
      }

      entry.marker.setLngLat([target.lng, target.lat]);

      if (state.popup && state.infoOpenId === entry.vehicle.id) {
        state.popup.setLngLat([target.lng, target.lat]);
      }
    }

    function distanceMetres(a, b) {
      const toRad = value => value * Math.PI / 180;
      const earth = 6371000;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const lat1 = toRad(a.lat);
      const lat2 = toRad(b.lat);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 2 * earth * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function popupHtml(vehicle) {
      const rows = [];
      if (vehicle.mapped && vehicle.vehicleType) rows.push(vehicle.vehicleType);
      if (vehicle.mapped && vehicle.livery) rows.push(vehicle.livery);
      if (vehicle.destination) rows.push(`To ${vehicle.destination}`);

      return `<div class="popup">
        <div class="popup-top">
          <span class="popup-route ${vehicle.mapped ? '' : 'unknown'}">${escapeHtml(vehicle.route || '—')}</span>
          <span class="popup-title">${escapeHtml(publicVehicleTitle(vehicle))}</span>
        </div>
        ${rows.map(row => `<div class="popup-row">${escapeHtml(row)}</div>`).join('')}
        <div class="popup-muted">GPS ${escapeHtml(timeAgo(vehicle.recordedAt))}</div>
      </div>`;
    }

    function openVehicleInfo(vehicle) {
      if (!state.mapReady || !state.map) return;
      const entry = state.markers.get(vehicle.id);
      if (!entry) return;

      if (state.popup) state.popup.remove();

      const lngLat = entry.marker.getLngLat();
      state.popup = new maplibregl.Popup({
        offset: 28,
        closeButton: true,
        closeOnClick: false,
        maxWidth: '320px'
      })
        .setLngLat([lngLat.lng, lngLat.lat])
        .setHTML(popupHtml(vehicle))
        .addTo(state.map);

      state.infoOpenId = vehicle.id;
      state.popup.on('close', () => {
        state.infoOpenId = null;
        state.popup = null;
      });
    }

    function selectVehicle(id, pan = true) {
      state.selectedId = id;
      state.followSelected = true;
      const vehicle = visibleVehicles().find(item => item.id === id);
      if (!vehicle) return;

      renderList(visibleVehicles());
      renderMarkers(visibleVehicles());
      renderSelectedCard();

      const entry = state.markers.get(id);
      if (entry && state.mapReady) {
        const lngLat = entry.marker.getLngLat();
        if (pan) {
          state.map.easeTo({
            center: [lngLat.lng, lngLat.lat],
            zoom: Math.max(state.map.getZoom(), 14),
            duration: 700,
            essential: true
          });
        }
        openVehicleInfo(vehicle);
      }
    }

    function renderSelectedCard() {
      const vehicle = visibleVehicles().find(item => item.id === state.selectedId);
      if (!vehicle) {
        hideSelectedCard();
        return;
      }

      els.selectedRoute.textContent = vehicle.route || '—';
      els.selectedRoute.classList.toggle('unknown', !vehicle.mapped);
      els.selectedTitle.textContent = publicVehicleTitle(vehicle);
      els.selectedSub.textContent = publicVehicleSubtitle(vehicle);
      els.selectedDest.textContent = vehicle.destination ? `Service to ${vehicle.destination}` : 'Live journey';
      els.selectedTime.textContent = `GPS ${timeAgo(vehicle.recordedAt)}`;
      els.selectedCard.classList.add('show');
    }

    function hideSelectedCard() {
      els.selectedCard.classList.remove('show');
    }

    function fitToVehicles(vehicles) {
      if (!state.mapReady || !state.map) return;
      const points = validVehicles(vehicles);

      if (!points.length) {
        state.map.easeTo({
          center: [DEFAULT_CENTER.lng, DEFAULT_CENTER.lat],
          zoom: DEFAULT_ZOOM,
          duration: 500,
          essential: true
        });
        return;
      }

      if (points.length === 1) {
        state.map.easeTo({
          center: [points[0].longitude, points[0].latitude],
          zoom: 14,
          duration: 600,
          essential: true
        });
        return;
      }

      const bounds = new maplibregl.LngLatBounds();
      points.forEach(vehicle => bounds.extend([vehicle.longitude, vehicle.latitude]));
      state.map.fitBounds(bounds, {
        padding: { top: 55, right: 55, bottom: 55, left: 55 },
        maxZoom: 13,
        duration: 700,
        essential: true
      });
    }

    function publicVehicleTitle(vehicle) {
      if (vehicle.mapped) {
        return [
          vehicle.fleetNumber ? `Fleet ${vehicle.fleetNumber}` : '',
          vehicle.registration
        ].filter(Boolean).join(' • ') || 'Mapped vehicle';
      }
      return `Tracker ${vehicle.machineLabel || vehicle.machineId || 'Unknown'}`;
    }

    function publicVehicleSubtitle(vehicle) {
      if (vehicle.mapped) return vehicle.vehicleType || vehicle.livery || 'Vehicle details added';
      return 'Vehicle details not added yet';
    }

    function favouriteKey(vehicle) {
      return vehicle.mapped
        ? `bus:${vehicle.fleetNumber || vehicle.registration || vehicle.id}`
        : `machine:${vehicle.machineId || vehicle.id}`;
    }

    function vehicleSort(a,b) {
      if (a.mapped !== b.mapped) return a.mapped ? -1 : 1;
      return collator.compare(a.fleetNumber || a.registration || a.machineId || '', b.fleetNumber || b.registration || b.machineId || '');
    }

    function timeAgo(iso) {
      const time = Date.parse(iso || '');
      if (!time) return 'time unavailable';
      const seconds = Math.max(0, Math.round((Date.now() - time) / 1000));
      if (seconds < 10) return 'just now';
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.round(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      return new Date(time).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    }

    function setAuthMode(mode) {
      state.authMode = mode;
      const register = mode === 'register';
      els.loginTab.classList.toggle('active', !register);
      els.registerTab.classList.toggle('active', register);
      els.nameField.style.display = register ? 'block' : 'none';
      els.confirmField.style.display = register ? 'block' : 'none';
      els.confirmPassword.required = register;
      els.displayName.required = register;
      els.authSubmit.textContent = register ? 'Create account' : 'Login';
      els.forgotBtn.style.display = register ? 'none' : 'inline-block';
      els.password.autocomplete = register ? 'new-password' : 'current-password';
      els.authMessage.textContent = '';
    }

    function closeModal() {
      els.accountModal.classList.remove('show');
      els.authMessage.textContent = '';
    }

    function friendlyAuthError(error) {
      const code = error?.code || '';
      if (code.includes('invalid-credential')) return 'Incorrect email or password.';
      if (code.includes('email-already-in-use')) return 'That email already has an account.';
      if (code.includes('weak-password')) return 'Use a stronger password.';
      if (code.includes('invalid-email')) return 'Enter a valid email address.';
      if (code.includes('too-many-requests')) return 'Too many attempts. Try again later.';
      return error?.message || 'Something went wrong.';
    }

    function showMapStatus(message) {
      els.mapStatus.textContent = message;
      els.mapStatus.classList.add('show');
    }

    function hideMapStatus() {
      els.mapStatus.classList.remove('show');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
      }[character]));
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    setAuthMode('login');
    initialiseMap();
    loadLive();
  </script>
</body>
</html>
